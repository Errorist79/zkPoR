[package]
name = "ultrahonk_soroban_verifier"
version = "0.1.0"
edition = "2021"

license     = "MIT"
description = "Rust verifier for UltraHonk proofs"
repository  = "https://github.com/yugocabrio/rs-soroban-ultrahonk"

[dependencies]
soroban-sdk = { workspace = true }

# The self-contained unit tests need the testutils Env. The upstream
# fixture-coupled tests are not vendored, because they load demo circuits that
# this system does not contain. That is why the test-utils dependency is
# absent here.
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = []
std = []
trace = []
