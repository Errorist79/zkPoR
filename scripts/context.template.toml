# The attestation context, as a template to copy and fill in.
#
# Copy this file somewhere outside this repository, put your own values in it,
# and give that path to the run. Do not fill this copy in and do not put yours
# under `fixtures/`: the client refuses a context whose path holds a `fixtures`
# directory, because the material there is public and a run built on it would
# produce customer packages that protect nothing.
#
# Every field below is read. The generator hashes the authority, the asset, the
# set of reserves and the snapshot ledger into one context hash, and the
# registry derives the same hash from the entry it holds. A value here that
# differs from the entry produces a proof that the registry rejects, so these
# are not descriptions of your intent. They are a copy of what the registry
# already records, and the place to read them is the registry itself.

# The issuer account of a classic asset, or the administrator of a contract
# token. It is the address that registered the asset, and the registry stores
# it as the authority of the entry.
authority = "PUT THE AUTHORITY ADDRESS HERE"

# The asset. A contract address for a contract token, and the contract of the
# classic asset otherwise.
asset = "PUT THE ASSET ADDRESS HERE"

# Every reserve address of the entry, and no other address. The order does not
# matter, because the registry hashes the set rather than the list, but a
# missing or extra address changes the hash and the proof then fails.
reserves = ["PUT THE FIRST RESERVE ADDRESS HERE", "PUT THE SECOND ONE HERE"]

# The ledger at which the liabilities freeze. The customer balances in your
# balance file are the balances at this ledger, and the registry refuses an
# attestation whose snapshot is older than the window that the context crate
# fixes.
snapshot_ledger = 0
