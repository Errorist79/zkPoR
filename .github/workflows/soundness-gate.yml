name: soundness-gate

# End-to-end on-chain soundness gate for the production Proof-of-Reserves
# pipeline. Runs on a SELF-HOSTED runner on the toolchain box: the gate needs
# the BN254 host functions (Protocol-27 localnet) and the real Noir/bb proving
# toolchain, which hosted GitHub runners do not provide. See tools/gate/README.md
# for the runner requirements. No credentials are used.

on:
  push:
    branches: [main]
    paths:
      - 'circuits/**'
      - 'contracts/**'
      - 'tools/**'
      - 'scripts/versions.env'
      - '.github/workflows/soundness-gate.yml'
  pull_request:
    paths:
      - 'circuits/**'
      - 'contracts/**'
      - 'tools/**'
      - 'scripts/versions.env'
      - '.github/workflows/soundness-gate.yml'
  workflow_dispatch:

# One gate run at a time: it deploys to a shared local network on the runner.
concurrency:
  group: soundness-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: [self-hosted, zkpor]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production soundness gate
        env:
          START_LOCALNET: "1"
        run: bash tools/gate/soundness-gate.sh

      # The gate rebuilds the pin chain, the manifest, and the aggregator key
      # from the committed sources. A difference here means a committed
      # artifact no longer matches what the tooling produces.
      - name: Compare the regenerated artifacts with the committed ones
        run: |
          git diff --exit-code --stat -- \
            circuits/recursion/manifest.json \
            circuits/recursion/agg/vk \
            circuits/recursion/agg/src/params.nr \
            circuits/recursion/common/src/params.nr
