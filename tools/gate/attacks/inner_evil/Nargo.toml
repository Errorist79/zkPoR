[package]
name = "recursion_inner_evil"
type = "bin"
authors = [""]
compiler_version = ">=1.0.0"

# Adversarial inner circuit for the hardening negative tests only. NOT part of
# the production path: it drops the u64 range check so a negative / field-wrapped
# balance deflates the subtotal. Its vk differs from the pinned inner circuit, so
# the hardened aggregator must reject any batch proven with it.
[dependencies]
recursion_common = { path = "../../../../circuits/recursion/common" }
poseidon = { tag = "v0.2.0", git = "https://github.com/noir-lang/poseidon" }
