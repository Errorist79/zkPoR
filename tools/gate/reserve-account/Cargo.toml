# Gate scaffolding, and not a part of the contract workspace. The empty table
# keeps this package out of it.
[workspace]

[package]
name = "gate-reserve-account"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "=26.0.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
